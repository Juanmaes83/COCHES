<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>COCHES — Premium Motion Lab</title>
<style>
:root{font-family:Inter,Arial,sans-serif;color:#111;background:#e9e9e4}*{box-sizing:border-box}html,body{margin:0;min-width:320px;min-height:100%;overflow:hidden}button{font:inherit}.app{height:100vh;padding:18px;background:#e9e9e4}.stage{position:relative;height:calc(100vh - 118px);overflow:hidden;background:#f7f7f3;cursor:grab;user-select:none;touch-action:none}.stage.dragging{cursor:grabbing}.brand{position:absolute;top:26px;left:28px;z-index:30;font-size:11px;letter-spacing:.16em}.giant{position:absolute;left:50%;top:50%;translate:-50% -54%;z-index:1;font-size:min(52vw,680px);line-height:.74;font-weight:500;letter-spacing:-.08em;color:rgba(17,17,17,.055);pointer-events:none;will-change:transform}.copy{position:absolute;top:13vh;left:6vw;width:min(310px,33vw);z-index:28;pointer-events:none}.copy .eyebrow{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.copy h1{margin:14px 0 10px;font-size:clamp(28px,3.1vw,52px);line-height:.96;font-weight:500;letter-spacing:-.045em}.copy p{max-width:280px;margin:0 0 22px;font-size:13px;line-height:1.5;color:rgba(17,17,17,.62)}.copy button{pointer-events:auto;border:1px solid #111;background:transparent;padding:11px 16px;font-size:11px}.vehicles{position:absolute;inset:0;z-index:10}.vehicle{position:absolute;left:50%;top:51%;width:min(48vw,720px);aspect-ratio:2.45/1;translate:-50% -50%;will-change:transform,opacity}.car{position:absolute;inset:18% 5% 10%;filter:drop-shadow(0 24px 18px rgba(0,0,0,.12))}.body{position:absolute;left:3%;right:3%;bottom:18%;height:38%;border-radius:48% 22% 16% 18%/36% 42% 28% 25%;background:linear-gradient(180deg,#6b6d6f,#252728 62%,#171819)}.roof{position:absolute;left:24%;right:28%;bottom:49%;height:30%;clip-path:polygon(17% 100%,37% 7%,70% 0,100% 100%);background:linear-gradient(140deg,#707477,#25292c 48%,#474b4e)}.wheel{position:absolute;bottom:7%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#b7b9ba 0 12%,#2e3031 13% 35%,#0d0e0e 36% 67%,#292b2c 68%);border:2px solid #111}.wa{left:15%}.wb{right:14%}.tag{position:absolute;left:50%;bottom:0;translate:-50%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.46}.drag{position:absolute;left:50%;top:72%;z-index:35;width:64px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;translate:-50% -50%;background:#111;color:#fff;font-size:10px;pointer-events:none;transition:transform .15s}.stage.dragging .drag{transform:scale(.88)}.pagination{position:absolute;bottom:28px;left:50%;z-index:32;translate:-50%;display:flex;gap:9px}.pagination button{width:24px;height:2px;border:0;padding:0;background:rgba(17,17,17,.18);cursor:pointer}.pagination button.active{background:#111}.panel{height:82px;display:flex;align-items:center;justify-content:space-between;gap:24px}.readout{display:flex;flex-direction:column;gap:7px}.readout span{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.readout strong{font-size:22px;font-weight:500}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.actions button{border:1px solid rgba(17,17,17,.2);background:transparent;padding:8px 11px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}.actions button.on{background:#111;color:#fff;border-color:#111}@media(max-width:760px){.app{padding:8px}.stage{height:calc(100vh - 138px)}.copy{top:8vh;left:22px;width:74vw}.copy p{display:none}.vehicle{width:82vw;top:56%}.giant{font-size:92vw}.drag{top:76%;width:54px}.panel{align-items:flex-start;padding-top:10px}.actions{max-width:68%}}
</style>
</head>
<body>
<div class="app">
<section class="stage" id="stage">
<div class="brand">MOTION / LAB</div>
<div class="giant" id="giant">2</div>
<div class="copy"><span class="eyebrow" id="eyebrow"></span><h1 id="title"></h1><p id="copy"></p><button>Discover</button></div>
<div class="vehicles" id="vehicles"></div>
<div class="drag">Drag</div>
<nav class="pagination" id="pagination"></nav>
</section>
<div class="panel"><div class="readout"><span>Motion Lab 01</span><strong id="readout">0.000</strong></div><div class="actions"><button id="prev">Previous</button><button id="next">Next</button><button id="inertia" class="on">Inertia</button><button id="parallax" class="on">Parallax</button><button id="reset">Reset</button></div></div>
</div>
<script>
const slides=[{mark:'2',model:'Polestar 2',eyebrow:'Fastback',copy:'A controlled, progressive motion study.'},{mark:'1',model:'Polestar 1',eyebrow:'Electric performance hybrid',copy:'The central state carries visual authority.'},{mark:'P',model:'Precept',eyebrow:'Concept',copy:'A reusable product presentation engine.'}];
const stage=document.getElementById('stage'), vehicles=document.getElementById('vehicles'), giant=document.getElementById('giant'), title=document.getElementById('title'), eyebrow=document.getElementById('eyebrow'), copy=document.getElementById('copy'), readout=document.getElementById('readout'), pagination=document.getElementById('pagination');
let progress=0,dragging=false,inertia=true,parallax=true,startX=0,startProgress=0,lastX=0,lastT=0,velocity=0,raf=0;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
slides.forEach((s,i)=>{const el=document.createElement('article');el.className='vehicle';el.innerHTML='<div class="car"><div class="roof"></div><div class="body"></div><div class="wheel wa"></div><div class="wheel wb"></div></div><span class="tag">'+s.model+'</span>';vehicles.appendChild(el);const b=document.createElement('button');b.onclick=()=>goTo(i);pagination.appendChild(b)});
const vehicleEls=[...vehicles.children],pageEls=[...pagination.children];
function render(){const active=clamp(Math.round(progress),0,slides.length-1),s=slides[active];giant.textContent=s.mark;giant.style.transform='translate3d('+((progress-active)*-5)+'vw,0,0)';title.textContent=s.model;eyebrow.textContent=s.eyebrow;copy.textContent=s.copy;readout.textContent=progress.toFixed(3);vehicleEls.forEach((el,i)=>{const d=i-progress,a=Math.abs(d),x=d*58,scale=1-Math.min(a*.08,.16),opacity=1-Math.min(a*.42,.72),y=parallax?a*14:0,rot=parallax?d*-1.4:0;el.style.transform='translate3d('+x+'vw,'+y+'px,0) scale('+scale+') rotate('+rot+'deg)';el.style.opacity=opacity;el.style.zIndex=20-Math.round(a*4)});pageEls.forEach((b,i)=>b.classList.toggle('active',i===active))}
function animateTo(target){cancelAnimationFrame(raf);const from=progress,t0=performance.now(),dur=780;function step(now){const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,4);progress=from+(target-from)*e;render();if(t<1)raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step)}
function goTo(i){animateTo(clamp(i,0,slides.length-1))}
stage.addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;stage.setPointerCapture(e.pointerId);cancelAnimationFrame(raf);dragging=true;stage.classList.add('dragging');startX=lastX=e.clientX;startProgress=progress;lastT=performance.now();velocity=0});
stage.addEventListener('pointermove',e=>{if(!dragging)return;const w=Math.max(innerWidth*.55,420),delta=e.clientX-startX,now=performance.now(),dt=Math.max(1,now-lastT);progress=clamp(startProgress-delta/w,0,slides.length-1);velocity=(e.clientX-lastX)/dt;lastX=e.clientX;lastT=now;render()});
function release(){if(!dragging)return;dragging=false;stage.classList.remove('dragging');const throwAmt=inertia?-velocity*.42:0;goTo(Math.round(clamp(progress+throwAmt,0,slides.length-1)))}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);
document.getElementById('prev').onclick=()=>goTo(Math.round(progress)-1);document.getElementById('next').onclick=()=>goTo(Math.round(progress)+1);document.getElementById('reset').onclick=()=>goTo(0);document.getElementById('inertia').onclick=e=>{inertia=!inertia;e.currentTarget.classList.toggle('on',inertia)};document.getElementById('parallax').onclick=e=>{parallax=!parallax;e.currentTarget.classList.toggle('on',parallax);render()};render();
</script>
</body></html>
