<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COCHES Motion Lab V0.2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Helvetica,sans-serif;background:#e9e9e4;overflow:hidden}.app{height:100vh;padding:16px}.stage{height:calc(100vh - 112px);position:relative;overflow:hidden;background:#f7f7f3;cursor:grab;touch-action:none;user-select:none}.stage.dragging{cursor:grabbing}.brand{position:absolute;top:26px;left:28px;z-index:50;font-size:11px;letter-spacing:.16em}.giant{position:absolute;left:50%;top:50%;translate:-50% -54%;font-size:min(52vw,680px);line-height:.74;color:#0000000f;z-index:1;pointer-events:none;will-change:transform,opacity}.copy{position:absolute;top:12vh;left:6vw;width:300px;z-index:30;pointer-events:none;will-change:opacity,transform}.copy h1{margin:12px 0 8px;font-size:clamp(30px,3.3vw,52px);font-weight:500;letter-spacing:-.04em}.copy span{font-size:10px;letter-spacing:.12em;text-transform:uppercase}.copy p{font-size:13px;line-height:1.5;color:#666}.vehicle{position:absolute;left:50%;top:53%;width:min(50vw,760px);aspect-ratio:2.45/1;will-change:transform,opacity}.car{position:absolute;inset:18% 5% 10%;filter:drop-shadow(0 24px 18px #0002)}.body{position:absolute;left:3%;right:3%;bottom:18%;height:38%;border-radius:48% 22% 16% 18%/36% 42% 28% 25%;background:linear-gradient(#777,#252728 62%,#171819)}.roof{position:absolute;left:24%;right:28%;bottom:49%;height:30%;clip-path:polygon(17% 100%,37% 7%,70% 0,100% 100%);background:linear-gradient(140deg,#777c7f,#25292c 48%,#4c5154)}.vehicle.v1 .body{background:linear-gradient(#c5c7c8,#6e7376 58%,#35383a)}.vehicle.v1 .roof{left:27%;right:25%;background:linear-gradient(140deg,#dedede,#74787b 48%,#aaa)}.vehicle.v2 .body{border-radius:55% 18% 12% 20%/45% 48% 24% 30%;background:linear-gradient(#ddd,#85898c 58%,#46494b)}.vehicle.v2 .roof{left:30%;right:22%;height:27%;background:linear-gradient(140deg,#e5e5e5,#7f8487 55%,#aaa)}.wheel{position:absolute;bottom:7%;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#bbb 0 12%,#303234 13% 35%,#0d0e0e 36% 67%,#292b2c 68%);border:2px solid #111}.w1{left:15%}.w2{right:14%}.tag{position:absolute;left:50%;bottom:0;translate:-50%;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.5}.drag{position:absolute;left:50%;top:74%;z-index:45;width:68px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;translate:-50% -50%;background:#111;color:white;font-size:10px;pointer-events:none}.pager{position:absolute;bottom:28px;left:50%;translate:-50%;display:flex;gap:9px;z-index:45}.pager i{display:block;width:26px;height:2px;background:#0002}.pager i.on{background:#111}.panel{height:80px;display:flex;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px}.actions button{padding:8px 10px;border:1px solid #bbb;background:transparent;font-size:10px;text-transform:uppercase}.actions button.on{background:#111;color:#fff}.read{font-size:12px}.read strong{font-size:22px;display:block}
@media(max-width:760px){.app{padding:8px}.stage{height:calc(100vh - 130px)}.copy{top:8vh;left:22px;width:70vw}.copy p{display:none}.vehicle{width:84vw;top:58%}.giant{font-size:92vw}.drag{top:80%;width:56px}.panel{align-items:flex-start;padding-top:8px}.actions{flex-wrap:wrap;justify-content:flex-end;max-width:70%}}
</style></head><body><div class="app"><section class="stage" id="stage"><div class="brand">MOTION / LAB 02</div><div id="giants"></div><div id="copies"></div><div id="vehicles"></div><div class="drag" id="dragLabel">Drag</div><div class="pager" id="pager"></div></section><div class="panel"><div class="read">progress<strong id="read">0.000</strong></div><div class="actions"><button id="prev">Previous</button><button id="next">Next</button><button id="inertia" class="on">Inertia</button><button id="parallax" class="on">Parallax</button><button id="reset">Reset</button></div></div></div>
<script>
const slides=[{mark:'2',model:'Polestar 2',eyebrow:'Fastback',copy:'Progressive performance, resolved through motion.'},{mark:'1',model:'Polestar 1',eyebrow:'Electric performance hybrid',copy:'A sculptural transition with controlled inertia.'},{mark:'P',model:'Precept',eyebrow:'Concept',copy:'A future-facing product experience.'}];
const stage=document.getElementById('stage'),vs=document.getElementById('vehicles'),gs=document.getElementById('giants'),cs=document.getElementById('copies'),pager=document.getElementById('pager'),read=document.getElementById('read'),dragLabel=document.getElementById('dragLabel');
slides.forEach((s,i)=>{const g=document.createElement('div');g.className='giant';g.textContent=s.mark;gs.appendChild(g);const c=document.createElement('div');c.className='copy';c.innerHTML='<span>'+s.eyebrow+'</span><h1>'+s.model+'</h1><p>'+s.copy+'</p>';cs.appendChild(c);const v=document.createElement('article');v.className='vehicle v'+i;v.innerHTML='<div class="car"><div class="roof"></div><div class="body"></div><div class="wheel w1"></div><div class="wheel w2"></div></div><span class="tag">'+s.model+'</span>';vs.appendChild(v);const dot=document.createElement('i');pager.appendChild(dot)});
const giants=[...gs.children],copies=[...cs.children],vehicles=[...vs.children],dots=[...pager.children];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),mix=(a,b,t)=>a+(b-a)*t,ease=t=>1-Math.pow(1-clamp(t,0,1),3);
let p=0,drag=false,inertia=true,parallax=true,startX=0,startP=0,lastX=0,lastT=0,vel=0,raf=0;
function pose(i){const seg=Math.floor(clamp(p,0,1.9999)),local=p-seg,e=ease(local);if(i===seg)return{x:mix(0,-76,e),y:parallax?mix(0,-10,e):0,s:mix(1,.90,e),r:parallax?mix(0,-1.2,e):0,o:mix(1,.28,e)};if(i===seg+1){const d=ease(clamp((local-.06)/.94,0,1));return{x:mix(74,0,d),y:parallax?mix(18,0,d):0,s:mix(.91,1,d),r:parallax?mix(1.5,0,d):0,o:mix(.34,1,d)};if(i<seg)return{x:-92,y:0,s:.86,r:0,o:0};return{x:94,y:0,s:.86,r:0,o:0}}
function render(){const active=clamp(Math.round(p),0,2);read.textContent=p.toFixed(3);slides.forEach((s,i)=>{const w=clamp(1-Math.abs(p-i),0,1);giants[i].style.opacity=w*.95;giants[i].style.transform='translate3d('+((i-p)*-3.5)+'vw,0,0)';copies[i].style.opacity=w;copies[i].style.transform='translateY('+((1-w)*22)+'px)';const q=pose(i);vehicles[i].style.transform='translate3d(calc(-50% + '+q.x+'vw),calc(-50% + '+q.y+'px),0) scale('+q.s+') rotate('+q.r+'deg)';vehicles[i].style.opacity=q.o;vehicles[i].style.zIndex=20-Math.round(Math.abs(i-p)*4);dots[i].classList.toggle('on',i===active)})}
function go(target){cancelAnimationFrame(raf);const from=p,to=clamp(target,0,2),t0=performance.now(),dur=720;function step(now){const t=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-t,4);p=mix(from,to,e);render();if(t<1)raf=requestAnimationFrame(step)}raf=requestAnimationFrame(step)}
stage.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;cancelAnimationFrame(raf);stage.setPointerCapture(e.pointerId);drag=true;stage.classList.add('dragging');dragLabel.textContent='Release';startX=lastX=e.clientX;startP=p;lastT=performance.now();vel=0;e.preventDefault()});
stage.addEventListener('pointermove',e=>{if(!drag)return;const width=Math.max(stage.clientWidth*.62,360),now=performance.now(),dt=Math.max(1,now-lastT);p=clamp(startP-(e.clientX-startX)/width,0,2);vel=(e.clientX-lastX)/dt;lastX=e.clientX;lastT=now;render();e.preventDefault()});
function release(e){if(!drag)return;drag=false;stage.classList.remove('dragging');dragLabel.textContent='Drag';if(e&&stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);const projected=p+(inertia?-vel*.72:0);go(Math.round(clamp(projected,0,2)))}stage.addEventListener('pointerup',release);stage.addEventListener('pointercancel',release);window.addEventListener('blur',()=>{if(drag)release()});
document.getElementById('prev').onclick=()=>go(Math.round(p)-1);document.getElementById('next').onclick=()=>go(Math.round(p)+1);document.getElementById('reset').onclick=()=>go(0);document.getElementById('inertia').onclick=e=>{inertia=!inertia;e.currentTarget.classList.toggle('on',inertia)};document.getElementById('parallax').onclick=e=>{parallax=!parallax;e.currentTarget.classList.toggle('on',parallax);render()};render();
</script></body></html>
